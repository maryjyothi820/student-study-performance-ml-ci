
name: Student Performance ML CI and CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train ML model
        run: python train_model.py

      - name: Run quality gate
        run: python quality_gate.py

      - name: Test ML pipeline
        run: python -m pytest -v test_ml_pipeline.py

      - name: Test Flask application
        run: python -m pytest -v test_app.py

      - name: Prepare release candidate
        if: success()
        run: |
          mkdir release_candidate
          cp app.py release_candidate/
          cp student_result_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          echo "Student Performance Prediction API" > release_candidate/DEPLOYMENT.txt
          echo "Install dependencies using: pip install -r requirements.txt" >> release_candidate/DEPLOYMENT.txt
          echo "Run the API using: python app.py" >> release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
