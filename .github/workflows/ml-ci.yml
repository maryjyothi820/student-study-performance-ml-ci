name: Student Performance ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML model
        run: python train_model.py

      - name: Run quality gate
        run: python quality_gate.py

      - name: Run tests
        run: pytest -v

      - name: Upload model and metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-artifact
          path: |
            student_result_model.pkl
            metrics.json
          if-no-files-found: error
